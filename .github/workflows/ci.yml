name: CI

# Runs on every pull request and on main. Production deploys are done by Vercel's Git
# integration when a PR is merged into main; branch protection requires these checks first.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://postgres@localhost:5432/astra_ci
  DATABASE_URL_UNPOOLED: postgresql://postgres@localhost:5432/astra_ci
  NEXTAUTH_SECRET: ci-only-secret-not-used-in-production
  NEXTAUTH_URL: http://localhost:3000

jobs:
  checks:
    name: Lint, typecheck, unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          # Throwaway container: passwordless trust auth, so no credential lives in the repo
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: astra_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: Migrations apply cleanly and seed works
        run: npm run db:setup
      - name: Build
        run: npm run build

  e2e:
    name: End-to-end tests
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          # Throwaway container: passwordless trust auth, so no credential lives in the repo
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: astra_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:setup
      - run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run Playwright against the production build
        env:
          E2E_COMMAND: npm start
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
