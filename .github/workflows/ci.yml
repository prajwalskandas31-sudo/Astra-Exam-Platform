name: CI

# Runs on every pull request and on main. Production deploys are done by Vercel's Git
# integration when a PR is merged into main; protect main so this check must pass first.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: file:./ci.db
  NEXTAUTH_SECRET: ci-only-secret-not-used-in-production
  NEXTAUTH_URL: http://localhost:3000

jobs:
  checks:
    name: Lint, typecheck, unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: Create and seed database
        run: npm run db:setup
      - name: Build
        run: npm run build
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: |
            .next
            !.next/cache
            prisma/ci.db
          include-hidden-files: true
          retention-days: 1

  e2e:
    name: End-to-end tests
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - uses: actions/download-artifact@v4
        with:
          name: next-build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run Playwright against the production build
        env:
          E2E_COMMAND: npm start
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
